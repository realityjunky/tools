[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hugobiotech-vision-bridge"
version = "0.2.1"
description = "Local MCP bridge safely analyzing images through fixed Qwen3-VL-Plus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=2.0,<3",
  "pillow>=10.4",
]

[project.scripts]
vision-bridge = "vision_bridge.server:main"

[dependency-groups]
test = [
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
]

[tool.uv]
default-groups = ["test"]

[tool.hatch.build.targets.wheel]
packages = ["src/vision_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vision_bridge"]
